
{% load static %}
<html>
  <head>
    <meta charset="utf-8">
    <link href="{% static 'areg.css' %}"type="text/css" rel="stylesheet"> 
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head> 
<body > 
<h1 align="center">Update Query</h1>
<h2 style="color:red" align="center">{{msg}}</h2>

    <div class="wrapper">
      <form action="{% url 'updaterec' data.id %}" method="post">
         {% csrf_token %}
        
            <div class="box">
          <label for="fullName" class="fl fontLabel"> Full Name: </label>
                <div class="new iconBox">
            <i class="fa fa-user" aria-hidden="true"></i>
          </div>
                <div class="fr">
                        <input type="text" name="fname" placeholder="Full Name"
              class="textBox" autofocus="on" required value="{{data.fname}}">
                </div>
                <div class="clr"></div>
            </div>

            <div class="box">
          <label for="phone" class="fl fontLabel"> Phone No.: </label>
                <div class="fl iconBox"><i class="fa fa-phone-square" aria-hidden="true"></i></div>
                <div class="fr">
                        <input type="text" required name="phone" maxlength="10" placeholder="Phone No." class="textBox"
                        value="{{data.phone}}">
                </div>
                <div class="clr"></div>
            </div>  
            <div class="box">
          <label for="email" class="fl fontLabel"> Email ID: </label>
                <div class="fl iconBox"><i class="fa fa-envelope" aria-hidden="true"></i></div>
                <div class="fr">
                        <input type="email" required name="email" placeholder="Email Id" class="textBox" value="{{data.email}}">
                </div>
                <div class="clr"></div>
              </div>            
           <div class="box">
          <label for="Query" class="fl fontLabel">Query: </label>
                <div class="new iconBox">
            <i class="fa fa-user" aria-hidden="true"></i>
          </div>
                <div class="fr">
                        <input type="text" name="query" placeholder="Query" value="{{data.query}}"
              class="textBox" autofocus="on" required>
                </div>
                <div class="clr"></div>
            </div>
              
            <div class="box terms">
                    <input type="checkbox" required> &nbsp; I accept the terms and conditions
            </div>

            
            <div class="box" style="background: #2d3e3f">
                    <input type="submit" class="submit" value="SUBMIT">
            </div>
      </form>
    </div>
</body>
 </html>
