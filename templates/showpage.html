{% include 'anav.html' %}
<br>
{% load static %}
<!DOCTYPE html>
<html>
<head>
	<title>result</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>

	<table class="table table-primary w-75" align="center" >
  <thead>
    <tr>
      <th scope="col">Full Name</th>
      <th scope="col">Email</th>
      <th scope="col">Contact</th>
      <th scope="col">Query</th>
      <th scope="col">Delete</th>
      <th scope="col">Update</th>
      
    </tr>
  </thead>
  {% if key1 %}
  <tbody>
    {% for i in key1 %}
   
  <tr>
  <td>{{i.fname}}</td>
  <td>{{i.email}}</td>
  <td>{{i.phone}}</td>
  <td>{{i.query}}</td>
  <td><a class="btn btn-danger btn-sm" style="border-radius: 0px;" href="{% url 'deletedata' i.id %}" role="button">Delete</a></td>
  <td><a class="btn btn-warning btn-sm" style="border-radius: 0px;" href="{% url 'updaterec' i.id %}" role="button">Update</a></td>
    

</tr>
{% endfor %}
</tbody>
{% endif %}
</table>

</body>
</html>
